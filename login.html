<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SkillSwap</title>

  <link rel="stylesheet" href="css/login.css">
</head>

<body>

<a href="index.html" class="back-home">← Back</a>

<div class="container">

  <div class="left">
    <h1>Welcome Back 👋</h1>
    <p>Login to continue your SkillSwap journey</p>
  </div>

  <div class="right">

    <h2>Login</h2>

<div class="input-box">
  <input type="email" class="login-email" placeholder="Email address">
</div>

<div class="input-box">
  <input type="password" class="login-password" placeholder="Password">
</div>

<button class="btn" onclick="login()">Login</button>

    <p class="text">
      Don't have an account?
      <a href="signup.html">Create account</a>
    </p>

  </div>

</div>
<script src="js/auth.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup - SkillSwap</title>

  <link rel="stylesheet" href="css/signup.css">
</head>

<body>

<a href="index.html" class="back-home">← Back</a>

<div class="container">

  <div class="left">
    <h1>Join SkillSwap 🚀</h1>
    <p>Create your account and start sharing skills with the world</p>
  </div>

  <div class="right">

    <h2>Create Account</h2>

    
    <div class="input-box">
  <input type="text" class="signup-name" placeholder="Full Name">
</div>

<div class="input-box">
  <input type="email" class="signup-email" placeholder="Email address">
</div>

<div class="input-box">
  <input type="password" class="signup-password" placeholder="Password">
</div>

<button class="btn" onclick="signup()">Signup</button>

    <p class="text">
      Already have an account?
      <a href="login.html">Login</a>
    </p>

  </div>

</div>
<script src="js/auth.js"></script>
</body>
</html>
